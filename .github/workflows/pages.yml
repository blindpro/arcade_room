name: Deploy Arcade Room to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: '*/package-lock.json'

      - name: Build game assets
        shell: bash
        run: |
          set -euo pipefail
          failed=()
          for game_dir in */; do
            game="${game_dir%/}"
            [[ -f "$game/package.json" && -f "$game/Gulpfile.js" ]] || continue
            echo "::group::Building $game"
            # gulp resolves its gulpfile and local install from the cwd,
            # so each game has to be built from inside its own directory.
            if (
              cd "$game" &&
              { npm ci --no-audit --no-fund || npm install --no-audit --no-fund; } &&
              npx gulp build
            ); then
              echo "Built $game"
            else
              failed+=("$game")
              echo "::error title=Build failed::$game did not build"
            fi
            echo "::endgroup::"
          done
          if (( ${#failed[@]} )); then
            echo "Failed games: ${failed[*]}"
            exit 1
          fi

      - name: Assemble Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html _site/
          touch _site/.nojekyll

          for game_dir in */; do
            game="${game_dir%/}"
            [[ "$game" == "_site" ]] && continue
            if [[ -f "$game/public/index.html" ]]; then
              cp -R "$game/public" "_site/$game"
            fi
          done

      - name: Verify launcher entries
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          while read -r game; do
            [[ -n "$game" ]] || continue
            [[ -f "_site/$game/index.html" ]] || missing+=("$game")
          done < <(sed -n '/id="games-data"/,/<\/script>/p' index.html \
                   | grep -o '"[^"]*"' | tr -d '"' | grep -v '^application/json$\|^games-data$')
          if (( ${#missing[@]} )); then
            echo "::error title=Missing games::Listed in index.html but not in the artifact: ${missing[*]}"
            exit 1
          fi
          echo "All launcher entries present."

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
