<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choose a game to play</title>
<style>
  *, ::after, ::before {
    background: 0 0;
    border: 0;
    box-sizing: border-box;
    color: inherit;
    cursor: default;
    font: inherit;
    margin: 0;
    padding: 0;
  }
  button, button *, button ::after, button ::before { cursor: pointer; }
  :root {
    background-color: #000;
    color: #fff;
    font-family: sans-serif;
    font-size: 16px;
    line-height: 1.5;
    user-select: none;
  }
  html, body { height: 100%; width: 100%; }
  :focus { outline: 2px solid #fff; }
  [hidden] { display: none !important; }
  button { cursor: pointer; }
  button[aria-disabled=true], button[disabled] { cursor: not-allowed; }

  @media (max-width: 20rem) { body { font-size: .5rem; } }
  @media (min-width: 20rem) {
    body { font-size: calc(.5rem + ((1vw - .4rem) * 1)); }
  }

  .u-screenReader {
    clip: rect(0,0,0,0);
    -webkit-clip-path: inset(50);
    clip-path: inset(50);
    border: 0;
    height: 1px;
    overflow: hidden;
    padding: 0;
    position: absolute;
    white-space: nowrap;
    width: 1px;
  }

  .a-app { height: 100%; width: 100%; }
  .a-app--screen { height: 100%; width: 100%; }

  .c-screen {
    display: flex;
    flex-direction: column;
    height: 100%;
    justify-content: center;
    padding: 2em;
    width: 100%;
  }

  .c-menu { align-items: center; text-align: center; }
  .c-menu--title {
    font-size: 3em;
    line-height: 1.1;
    margin-bottom: .5rem;
  }
  .c-menu--subtitle {
    font-size: 1.1em;
    max-width: 40em;
    opacity: .85;
  }
  .c-menu--list {
    display: flex;
    flex-direction: column;
    gap: .5rem;
    list-style: none;
    margin-top: 1.5rem;
    padding: 0;
    width: min(28em, 90vw);
  }
  .c-menu--list li { width: 100%; }
  .c-menu--button {
    background: rgba(255,255,255,.05);
    border: 2px solid rgba(255,255,255,.4);
    border-radius: .4rem;
    color: #fff;
    cursor: pointer;
    font-size: 1.05em;
    padding: .7em 1em;
    transition: background 120ms ease, border-color 120ms ease;
    width: 100%;
  }
  .c-menu--button:focus, .c-menu--button:hover {
    background: rgba(255,255,255,.18);
    border-color: #fff;
    outline: 0;
  }
</style>
</head>
<body>
<main class="a-app">
  <div class="a-app--announcer u-screenReader" aria-live="polite" aria-atomic="true" id="a-announcer-polite"></div>
  <div class="a-app--announcer u-screenReader" aria-live="assertive" aria-atomic="true" id="a-announcer-assertive"></div>

  <div class="a-app--screen a-app--launcher">
    <section class="c-screen c-menu a-launcher" tabindex="-1" aria-label="Game list">
      <h1 class="c-menu--title">Choose a game to play</h1>
      <p class="c-menu--subtitle">A small collection of audio and arcade games by Oriol Gómez.</p>
      <ul class="c-menu--list" id="gameList"></ul>
      <ul class="c-menu--list">
        <li><button class="c-menu--button" data-action="quit">Quit</button></li>
      </ul>
    </section>
  </div>
</main>

<script>
  // ---------------------------------------------------------------------------
  // Audio — non-spatial UI ticks (bumper pattern)
  // ---------------------------------------------------------------------------
  let audioCtx = null

  function getCtx() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)()
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume()
    }
    return audioCtx
  }

  function envelope(gain, t0, attack, hold, release, peak) {
    gain.cancelScheduledValues(t0)
    gain.setValueAtTime(0, t0)
    gain.linearRampToValueAtTime(peak, t0 + attack)
    gain.setValueAtTime(peak, t0 + attack + hold)
    gain.linearRampToValueAtTime(0, t0 + attack + hold + release)
  }

  function uiTick(freq, gain, dur) {
    freq = freq || 800
    gain = gain || 0.3
    dur = dur || 0.06
    const c = getCtx()
    const t0 = c.currentTime
    const out = c.createGain()
    out.gain.value = 0
    out.connect(c.destination)

    const osc = c.createOscillator()
    osc.type = 'triangle'
    osc.frequency.value = freq
    osc.connect(out)
    osc.start(t0)
    osc.stop(t0 + dur + 0.05)
    envelope(out.gain, t0, 0.005, 0.01, dur - 0.015, gain)

    osc.onended = function () { out.disconnect() }
  }

  function uiFocus() { uiTick(800, 0.18, 0.05) }
  function uiBack()  { uiTick(500, 0.22, 0.07) }

  // ---------------------------------------------------------------------------
  // Background music — quiet synthesized drone
  // ---------------------------------------------------------------------------
  var musicNodes = null

  function startMusic() {
    if (musicNodes) return
    var c = getCtx()
    if (c.state === 'suspended') return

    var master = c.createGain()
    master.gain.value = 0.04
    master.connect(c.destination)

    // Low drone
    var osc1 = c.createOscillator()
    osc1.type = 'sine'
    osc1.frequency.value = 55
    osc1.connect(master)

    // Fifth above
    var osc2 = c.createOscillator()
    osc2.type = 'sine'
    osc2.frequency.value = 82.5
    osc2.connect(master)

    // Slow LFO for gentle movement
    var lfo = c.createOscillator()
    lfo.type = 'sine'
    lfo.frequency.value = 0.15
    var lfoGain = c.createGain()
    lfoGain.gain.value = 10
    lfo.connect(lfoGain)
    lfoGain.connect(osc2.frequency)

    osc1.start()
    osc2.start()
    lfo.start()

    musicNodes = [master, osc1, osc2, lfo, lfoGain]
  }

  function stopMusic() {
    if (!musicNodes) return
    for (var i = 1; i < musicNodes.length; i++) {
      try { musicNodes[i].stop() } catch (_e) {}
    }
    musicNodes = null
  }

  // ---------------------------------------------------------------------------
  // Game list
  // ---------------------------------------------------------------------------
  var games = (window.ElectronApi && window.ElectronApi.listGames)
    ? window.ElectronApi.listGames()
    : []

  var list = document.getElementById('gameList')

  if (games.length === 0) {
    var li = document.createElement('li')
    li.textContent = 'No games found.'
    list.appendChild(li)
  } else {
    for (var i = 0; i < games.length; i++) {
      var name = games[i]
      var li = document.createElement('li')
      var btn = document.createElement('button')
      btn.className = 'c-menu--button'
      btn.dataset.game = name
      btn.textContent = name.charAt(0).toUpperCase() + name.slice(1)
      li.appendChild(btn)
      list.appendChild(li)
    }
  }

  // ---------------------------------------------------------------------------
  // Navigation helpers
  // ---------------------------------------------------------------------------
  function getButtons() {
    return Array.from(document.querySelectorAll('.a-launcher .c-menu--button'))
  }

  function focusNext(direction) {
    var buttons = getButtons()
    if (buttons.length === 0) return
    var focused = document.activeElement
    var idx = focused ? buttons.indexOf(focused) : -1
    var next = (idx + direction + buttons.length) % buttons.length
    buttons[next].focus()
  }

  function quitApp() {
    if (window.ElectronApi && window.ElectronApi.exit) {
      window.ElectronApi.exit()
    }
  }

  // ---------------------------------------------------------------------------
  // Focusin → uiFocus sound (bumper pattern)
  // ---------------------------------------------------------------------------
  document.addEventListener('focusin', function (e) {
    if (e.target.matches('.a-launcher .c-menu--button')) {
      uiFocus()
    }
  })

  // Start background music on first user gesture
  document.addEventListener('click', function resumeMusic() {
    startMusic()
    document.removeEventListener('click', resumeMusic)
  }, {once: true})

  // ---------------------------------------------------------------------------
  // Keyboard navigation
  // ---------------------------------------------------------------------------
  document.addEventListener('keydown', function (e) {
    var launcher = document.querySelector('.a-launcher')
    if (!launcher || !launcher.contains(document.activeElement)) return

    // First-letter navigation: press a letter/digit to jump to the first
    // game whose name starts with that character.
    if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
      var ch = e.key.toLowerCase()
      var buttons = getButtons()
      for (var i = 0; i < buttons.length; i++) {
        var txt = buttons[i].textContent.toLowerCase().trim()
        if (txt.charAt(0) === ch) {
          e.preventDefault()
          buttons[i].focus()
          return
        }
      }
    }

    if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
      e.preventDefault()
      focusNext(1)
    } else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
      e.preventDefault()
      focusNext(-1)
    } else if (e.key === 'Escape') {
      e.preventDefault()
      quitApp()
    }
  })

  // ---------------------------------------------------------------------------
  // Click delegation
  // ---------------------------------------------------------------------------
  document.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-game]')
    if (btn) {
      window.location.href = '../' + btn.dataset.game + '/public/index.html'
      return
    }
    var actionBtn = e.target.closest('[data-action]')
    if (actionBtn) {
      if (actionBtn.dataset.action === 'quit') {
        quitApp()
      }
    }
  })

  // ---------------------------------------------------------------------------
  // Focus first button on load
  // ---------------------------------------------------------------------------
  ;(function focusFirst() {
    var first = document.querySelector('.a-launcher .c-menu--button')
    if (first) first.focus()
  })()
</script>
</body>
</html>
